<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SeniorFlow" />
    <meta
      name="description"
      content="SeniorFlow - Sistema de gestión comercial"
    />
    <title>SeniorFlow</title>
    <link rel="manifest" href="./manifest.json?v=seniorflow-icon-20260808-02" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=seniorflow-icon-20260808-02" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png?v=seniorflow-icon-20260808-02" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'system-ui', 'sans-serif']
            }
          }
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
    <style>
      html, body, button, input, select, textarea {
        font-family: Manrope, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .sf-auth-screen { position: relative; isolation: isolate; overflow: hidden; background: #132723; }
      .sf-auth-backdrop { position: absolute; inset: 0; z-index: -1; background: linear-gradient(rgba(9,26,25,.40), rgba(9,26,25,.40)), url('./assets/login-warehouse.png') center/cover no-repeat; filter: blur(2px); transform: scale(1.02); }
      .sf-auth-card { width:min(420px, calc(100vw - 32px)) !important; padding:32px 30px 28px; border:1px solid rgba(255,255,255,.72); border-radius:16px; background:rgba(255,255,255,.96); box-shadow:0 22px 55px rgba(0,0,0,.28); }
      .sf-auth-mark { display: grid; place-items: center; margin: auto; color: #078d86; font-size: 2.35rem; font-weight: 900; font-style: italic; letter-spacing: -.18em; line-height: 1; }
      .sf-auth-spinner { width: 82px; height: 82px; border: 4px solid #e3e8eb; border-top-color: #078d86; border-right-color: #078d86; border-radius: 50%; animation: sf-auth-spin 1s linear infinite; }
      .sf-auth-input { min-height:44px; border:1px solid #d8e0e6; border-radius:8px; background:#fff; color:#26384e; }
      .sf-auth-input:focus { border-color: #078d86; box-shadow: 0 0 0 3px rgba(7,141,134,.13); }
      .sf-auth-submit { min-height: 49px; background: #078d86; color: #fff; box-shadow: 0 8px 18px rgba(7,141,134,.22); }
      .sf-auth-submit:hover { background: #06766f; }
      @keyframes sf-auth-spin { to { transform: rotate(360deg); } }
      @media (max-width:640px) { .sf-auth-screen { padding:16px; } .sf-auth-card { padding:30px 24px 26px; border-radius:14px; } }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const CURRENT_BUILD = 'seniorflow-flyer-gestion-20260904-60';
        window.__SENIORFLOW_BUILD__ = CURRENT_BUILD;
        const BUILD_KEY = 'seniorflow-current-build';
        if (window.location.protocol === 'file:' || localStorage.getItem(BUILD_KEY) === CURRENT_BUILD) return;
        const actualizarSistema = async () => {
          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((registration) => registration.unregister()));
            }
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map((key) => caches.delete(key)));
            }
          } catch (error) {
            console.warn('No se pudo limpiar la versión anterior de SeniorFlow.', error);
          } finally {
            localStorage.setItem(BUILD_KEY, CURRENT_BUILD);
            window.location.reload();
          }
        };
        actualizarSistema();
      })();
    </script>
    <script type="module" src="./app.js?v=seniorflow-flyer-gestion-20260904-60"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker
              .register('./sw.js?v=seniorflow-flyer-gestion-20260904-60')
            .catch((error) => console.error('No se pudo registrar la webapp:', error));
        });
      }
    </script>
    <script>
      (() => {
        if (window.location.protocol === 'file:') return;
        const BUILD_ACTUAL = window.__SENIORFLOW_BUILD__ || 'seniorflow-flyer-gestion-20260904-60';
        const POSPONER_KEY = 'seniorflow-actualizacion-pospuesta-hasta';
        const INTERVALO_CONTROL_MS = 3 * 60 * 1000;
        let buildDisponible = '';
        let aviso = null;

        const versionVisible = (build = '') => {
          const partes = String(build).split('-');
          return partes.length ? partes[partes.length - 1] : build;
        };

        const ocultarAviso = () => {
          aviso?.remove();
          aviso = null;
        };

        const actualizarAhora = async (boton) => {
          boton.disabled = true;
          boton.textContent = 'Preparando actualización...';
          try {
            if ('serviceWorker' in navigator) {
              const registros = await navigator.serviceWorker.getRegistrations();
              await Promise.allSettled(registros.map(async (registro) => {
                await registro.update();
                registro.waiting?.postMessage({ type: 'SKIP_WAITING' });
              }));
              await Promise.allSettled(registros.map((registro) => registro.unregister()));
            }
            if ('caches' in window) {
              const claves = await caches.keys();
              await Promise.allSettled(claves.map((clave) => caches.delete(clave)));
            }
            localStorage.removeItem('seniorflow-current-build');
            sessionStorage.removeItem(POSPONER_KEY);
          } catch (error) {
            console.warn('No se pudo completar la limpieza previa a la actualización.', error);
          } finally {
            const url = new URL(window.location.href);
            url.searchParams.set('actualizacion', Date.now().toString());
            window.location.replace(url.toString());
          }
        };

        const mostrarAviso = (nuevoBuild) => {
          if (!nuevoBuild || nuevoBuild === BUILD_ACTUAL) return;
          buildDisponible = nuevoBuild;
          const pospuestaHasta = Number(sessionStorage.getItem(POSPONER_KEY) || 0);
          if (Date.now() < pospuestaHasta || aviso) return;
          aviso = document.createElement('aside');
          aviso.setAttribute('role', 'alertdialog');
          aviso.setAttribute('aria-label', 'Actualización disponible');
          aviso.style.cssText = 'position:fixed;right:20px;bottom:20px;z-index:2147483647;width:min(420px,calc(100vw - 24px));font-family:Inter,system-ui,-apple-system,sans-serif;background:#fff;border:1px solid #bfdbfe;border-radius:16px;box-shadow:0 24px 65px rgba(15,23,42,.28);overflow:hidden;color:#17233c;';
          aviso.innerHTML = `
            <div style="height:5px;background:linear-gradient(90deg,#0f766e,#2563eb);"></div>
            <div style="padding:18px 18px 16px;">
              <div style="display:flex;align-items:flex-start;gap:12px;">
                <div style="width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:#ecfdf5;color:#047857;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;">↻</div>
                <div style="min-width:0;flex:1;">
                  <p style="margin:0;color:#0f172a;font-size:16px;line-height:1.25;font-weight:900;">Nueva actualización disponible</p>
                  <p style="margin:6px 0 0;color:#475569;font-size:13px;line-height:1.45;font-weight:600;">La versión ${versionVisible(nuevoBuild)} está lista. Guardá cualquier operación abierta antes de actualizar.</p>
                </div>
              </div>
              <div style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:16px;">
                <button type="button" data-accion="despues" style="min-height:40px;padding:9px 13px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#334155;font-size:12px;font-weight:800;cursor:pointer;">Recordarme más tarde</button>
                <button type="button" data-accion="actualizar" style="min-height:40px;padding:9px 15px;border:0;border-radius:9px;background:#0f766e;color:#fff;font-size:12px;font-weight:900;cursor:pointer;">Actualizar ahora</button>
              </div>
            </div>`;
          aviso.querySelector('[data-accion="despues"]').addEventListener('click', () => {
            sessionStorage.setItem(POSPONER_KEY, String(Date.now() + (30 * 60 * 1000)));
            ocultarAviso();
          });
          const botonActualizar = aviso.querySelector('[data-accion="actualizar"]');
          botonActualizar.addEventListener('click', () => actualizarAhora(botonActualizar));
          document.body.appendChild(aviso);
        };

        const controlarActualizacion = async () => {
          if (!navigator.onLine) return;
          try {
            const respuesta = await fetch(`./sw.js?control-version=${Date.now()}`, { cache: 'no-store', headers: { 'cache-control': 'no-cache' } });
            if (!respuesta.ok) return;
            const contenido = await respuesta.text();
            const encontrado = contenido.match(/seniorflow-flyer-gestion-\d{8}-\d+/)?.[0] || '';
            if (encontrado && encontrado !== BUILD_ACTUAL) mostrarAviso(encontrado);
          } catch (error) {
            // Sin conexión: se vuelve a intentar automáticamente.
          }
        };

        navigator.serviceWorker?.addEventListener('message', (event) => {
          const version = event?.data?.type === 'SENIORFLOW_UPDATE_READY' ? event.data.version : '';
          if (version && version !== BUILD_ACTUAL) mostrarAviso(version);
        });
        window.addEventListener('focus', controlarActualizacion);
        window.addEventListener('online', controlarActualizacion);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') controlarActualizacion();
        });
        window.setTimeout(controlarActualizacion, 15000);
        window.setInterval(controlarActualizacion, INTERVALO_CONTROL_MS);
      })();
    </script>
  </body>
</html>
